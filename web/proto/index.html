<!doctype html>
<html><head><meta charset="utf-8"><title>device proto</title>
<style>html,body{margin:0;background:#0b1a3a;height:100%}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildDevice, DIM } from './device.js';

const params = new URLSearchParams(location.search);
const W = +params.get('w') || 1200, H = +params.get('h') || 900;
const pose = params.get('pose') || 'hero';
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera(28, W / H, 1, 2000);
const { group, applicator, sensor, base } = buildDevice(renderer);
group.position.y = -DIM.H / 2;
scene.add(group);

// lights: key (cool white), rim (blue), fill
const key = new THREE.DirectionalLight(0xffffff, 3.2); key.position.set(120, 160, 80); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
const rim = new THREE.DirectionalLight(0x5fb0ff, 4); rim.position.set(-120, 60, -80);
const fill = new THREE.DirectionalLight(0xbfd6ff, 0.5); fill.position.set(-60, -10, 120);
scene.add(key, rim, fill, new THREE.AmbientLight(0x1a3366, 0.35));
// glow disc behind
const glow = new THREE.Mesh(new THREE.CircleGeometry(70, 64), new THREE.MeshBasicMaterial({ color: 0x2e90fa, transparent: true, opacity: 0.18 }));
glow.position.set(0, 0, -60); scene.add(glow);
// ground shadow catcher
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({ opacity: 0.35 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -DIM.H / 2 - 0.01; ground.receiveShadow = true; scene.add(ground);

if (pose === 'hero') { camera.position.set(60, 30, 200); group.rotation.y = +(params.get('ry') || -0.7); }
if (pose === 'front') { camera.position.set(0, 10, 170); }
if (pose === 'exploded') {
  camera.position.set(90, 20, 160); group.rotation.y = -0.4;
  applicator.position.y = 48; sensor.visible = true; base.visible = true; sensor.position.y = 14; base.position.y = -8;
}
if (pose === 'sensor') { camera.position.set(40, 60, 70); applicator.visible = false; base.visible = false; sensor.visible = true; sensor.position.y = 0; group.position.y = 0; camera.lookAt(0, 0, 0); }
if (pose !== 'sensor') camera.lookAt(0, 4, 0);

function frame() { renderer.render(scene, camera); window.__done = true; }
// wait for fonts/textures
setTimeout(frame, 300); setTimeout(frame, 900);
</script></body></html>
